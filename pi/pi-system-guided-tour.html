<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI System guided tour</title>
<style>
:root {
  --bg: #f3f6f7; --panel: #ffffff; --soft: #e9eff1; --text: #1c2a33; --muted: #566771;
  --border: #c5d1d7; --accent: #0a6f7e; --accent-text: #ffffff; --accent-tint: #dcf0f3;
  --warn: #8a5200; --warn-tint: #fbefd9;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f171c; --panel: #172229; --soft: #1e2c34; --text: #e3ebef; --muted: #9bacb5;
    --border: #2d3d46; --accent: #4cc3d4; --accent-text: #0b1a1f; --accent-tint: #173540;
    --warn: #f0b45a; --warn-tint: #2e2616;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); overflow-x: hidden;
  display: flex; flex-direction: column; padding: 0 16px; gap: 8px; }
header { padding-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 11px; cursor: pointer; }
select { max-width: 240px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#progress { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 7em; text-align: center; }
.show { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 0.8rem; color: var(--muted); align-items: center; }
.show label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }

main { flex: 1 1 auto; min-height: 0; display: grid; gap: 10px; grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr); }
#left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
#map-wrap { flex: 1 1 auto; min-height: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  display: flex; align-items: center; overflow: auto; }
#map { width: 100%; height: auto; max-height: 100%; display: block; min-width: 560px; }
#flows { min-height: 2.6em; font-size: 0.8rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
#flows b { color: var(--accent); font-weight: 600; }
.legend { font-size: 0.72rem; color: var(--muted); }

#panel { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
#panel h2 { margin: 0 0 6px; font-size: 1.05rem; }
.preview { font-size: 0.72rem; color: var(--muted); margin: -2px 0 4px; }
.remember { background: var(--accent-tint); border-left: 4px solid var(--accent); border-radius: 4px; padding: 6px 10px; font-size: 0.88rem; font-weight: 600; margin: 6px 0 8px; }
.sec { margin: 8px 0; }
.sec h3 { margin: 0 0 3px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
.sec p, .sec li { font-size: 0.84rem; line-height: 1.4; margin: 0; }
.sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
.sec .muted { color: var(--muted); }
.sec.limits h3 { color: var(--warn); }
.sec.limits { background: var(--warn-tint); border-radius: 5px; padding: 6px 10px; }
.sec.sample { border: 1px dashed var(--border); border-radius: 5px; padding: 6px 10px; }
.tbc { font-style: italic; color: var(--muted); font-size: 0.82rem; }
dl { margin: 0; font-size: 0.82rem; line-height: 1.35; }
dt { font-weight: 600; margin-top: 3px; }
dd { margin: 0; color: var(--muted); }
.nm { font-weight: 600; }
.lg { color: var(--muted); font-size: 0.78rem; }

#panel > * { flex: 0 0 auto; }
.walkctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; position: sticky; bottom: -12px; margin: auto -14px -12px; padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--border); z-index: 5; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0 2px; font-size: 0.84rem; text-decoration: underline; cursor: pointer; }
.walk .toggle { display: none; gap: 0; margin: 6px 0 0; }
.walk .toggle button { border-radius: 0; padding: 4px 12px; }
.walk .toggle button:first-child { border-radius: 6px 0 0 6px; }
.walk .toggle button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.walk .toggle button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
#flows .hop { color: var(--muted); }
.sec.walk { margin: 8px 0; }
.chart { margin-top: 4px; }
.chart svg { width: 100%; height: auto; display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 5px; }
.chart .ax { font-size: 10px; fill: var(--muted); }
.chart .ax.t { font-size: 10.5px; font-weight: 600; }
.chart .pl { font-size: 11px; font-weight: 600; fill: var(--text); text-anchor: middle; }
.chart .dl, .chart .ed { fill: var(--accent); font-weight: 600; }
.chart .hlt { fill: var(--accent); font-weight: 600; }
.chart .lg2 { fill: var(--text); font-size: 10.5px; }
.walk .caption { font-size: 0.86rem; line-height: 1.35; margin: 6px 0; }
.walkctl .stepno { font-size: 0.8rem; color: var(--muted); min-width: 6em; text-align: center; }
.walk .key { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
.walk details { margin-top: 6px; font-size: 0.8rem; }
.walk summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.walk table { border-collapse: collapse; width: 100%; margin-top: 4px; }
.walk th, .walk td { border: 1px solid var(--border); padding: 2px 5px; text-align: left; font-size: 0.74rem; }
.walk tr.cur td { background: var(--accent-tint); font-weight: 600; }

#narration { background: var(--panel); border: 1px solid var(--border); border-left: 5px solid var(--accent);
  border-radius: 6px; padding: 8px 14px; font-size: 1rem; min-height: 2.9em; }
#narration .stage-name { color: var(--accent); font-weight: 600; margin-right: 8px; }
footer { padding-bottom: 8px; font-size: 0.72rem; color: var(--muted); }

/* map */
.zone { fill: var(--soft); opacity: 0.55; }
.zone-label { font-size: 10px; fill: var(--muted); font-weight: 600; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.06em; }
.edge { fill: none; stroke: var(--accent); stroke-width: 1.8; opacity: 0.12; transition: opacity 0.3s; }
.edge.seen { opacity: 0.45; }
.edge.focus { opacity: 1; stroke-width: 2.4; stroke-dasharray: 7 5; animation: march 0.8s linear infinite; }
.edge.ref { stroke-dasharray: 3 4; }
.edge.focus.ref { stroke-dasharray: 7 5; }
@keyframes march { to { stroke-dashoffset: -12; } }
.mk { fill: var(--accent); }
.pulse { fill: var(--accent); }
.node rect { fill: var(--bg); stroke: var(--border); stroke-width: 1.2; transition: all 0.3s; }
.node { opacity: 0.22; transition: opacity 0.3s; color: var(--muted); }
.node.seen { opacity: 1; color: var(--accent); }
.node.focus { opacity: 1; color: var(--accent); }
.node.focus rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2.4; }
.node .l1 { font-size: 10.5px; font-weight: 600; fill: var(--text); text-anchor: middle; }
.node .l2 { font-size: 8.5px; fill: var(--muted); text-anchor: middle; }
.node .ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hub circle { fill: var(--accent); }
.node rect.ring, .node.focus rect.ring, .node.seen rect.ring { fill: none; stroke: var(--warn); stroke-width: 3.5; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.node[data-ring="1"] rect.ring { opacity: 1; }
.node[data-ring="1"] { opacity: 1; }
.badge { display: none; stroke: var(--accent); stroke-width: 1.6; }
svg.badges .badge, #storelegend .badge { display: block; }
.badge.record { fill: var(--accent); }
.badge.cache { fill: var(--bg); }
.badge.copy { fill: var(--bg); stroke-dasharray: 2 1.6; }
#storelegend .lgi svg { vertical-align: -2px; }
.chead { color: var(--accent); }
details.moredetail { margin: 10px 0 4px; border-top: 1px solid var(--border); padding-top: 6px; }
details.moredetail > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.86rem; }
.sec.key ul { gap: 4px; }
.edge[data-ring="1"] { stroke: var(--warn); stroke-width: 5; opacity: 1; stroke-dasharray: none; animation: none; }
.org { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
.kind { font-size: 0.72rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.03em; }
.unmapped { font-size: 0.76rem; color: var(--muted); font-style: italic; margin-top: 4px; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  #panel { max-height: none; }
  body { overflow-y: auto; height: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .node .ring { transition: none; }
  .edge.focus { animation: none; }
  .pulse { display: none; }
  .node, .edge, .node rect { transition: none; }
}
body.hide-names .sec.names, body.hide-limits .sec.limits, body.hide-governance .sec.governance,
body.hide-sample .sec.sample, body.hide-terms .sec.terms { display: none; }
</style>
</head>

    <button id="all" type="button" title="Last stage (End)">End</button>

    <button id="full" type="button" title="Fullscreen (F)">Fullscreen</button>
  </div>
  <div class="show" id="show" role="group" aria-label="Sections to show"></div>
</header>

    <div id="map-wrap"><svg id="map" role="img" aria-label="PI System architecture map"></svg></div>

</main>

<div id="narration" aria-live="polite"></div>

    var focusN = {}, focusE = {};

      nodeEls[id].setAttribute("class", "node" + (nodeById[id].type === "hub" ? " hub" : "") + (focusN[id] ? " focus" : seen.nodes[id] ? " seen" : ""));
    });
    var flows = $("flows");
    flows.textContent = "";
    Object.keys(edgeEls).forEach(function (id) {
      var o = edgeEls[id], f = focusE[id], base = "edge" + (o.def.type === "ref" ? " ref" : "");

      if (f) {

        var names = function (n) { return n.type === "hub" ? "Read access" : n.l1 + (n.l2 ? " " + n.l2 : ""); };
        row.appendChild(el("b", null, names(a) + (o.def.type === "ref" ? " ↔ " : " → ") + names(b)));
        row.appendChild(document.createTextNode(" · " + o.def.label));
        if (o.def.hop) row.appendChild(el("span", "hop", " · " + o.def.hop));

    rows.forEach(function (r) {

  function setRings(ids, eids) {

    Object.keys(edgeEls).forEach(function (id) { edgeEls[id].path.setAttribute("data-ring", eids && eids.indexOf(id) >= 0 ? "1" : "0"); });
  }
  function simMapSteps(cfg) {
    var frames = cfg.steps.map(function (st) {

      return { info: { head: head, caption: st.caption, nodes: st.nodes || [], edges: st.edges || [], unmapped: !!st.unmapped } };
    });

  }

  /* ---------- slope charts (exception and compression) ---------- */
  var activeChart = null, chartSeq = 0;
  function fmt(x) { if (Math.abs(x) < 5e-4) x = 0; var s = x.toFixed(3); if (s.charAt(s.length - 1) === "0") s = s.slice(0, -1); return s.replace("-", "−"); }
  function fv(x) { return x.toFixed(2); }
  function lerp(a, b, k) {
    if (typeof a === "number" && typeof b === "number") return a + (b - a) * k;

    });
  }

  function simException(cfg) {
    var P = cfg.points, dev = cfg.dev, sent = P.map(function () { return false; }), frames = [], rows = [], last = 0;
    var zeros = function () { return P.map(function () { return 0; }); };
    for (var k = 0; k < P.length; k++) {
      var p = P[k], lastBefore = P[last], diff = k === 0 ? 0 : Math.abs(p.v - lastBefore.v), decision, caption, old = null, hl = 0;
      if (k === 0) {
        sent[0] = true; decision = "Sent (first value)";
        caption = p.label + " arrives: the first value is always sent. The box is " + fv(p.v - dev) + "–" + fv(p.v + dev) + " bar around it.";
      } else if (diff > dev + 1e-9) {
        old = { x0: lastBefore.t, x1: p.t, lo: lastBefore.v - dev, hi: lastBefore.v + dev };
        if (!sent[k - 1]) { sent[k - 1] = true; hl = 1; }
        sent[k] = true; last = k;
        decision = "Sent" + (hl ? ", with " + P[k - 1].label + " (previous value)" : "");
        caption = p.label + " (" + fv(p.v) + ") is " + (p.v > lastBefore.v ? "above" : "below") + " the box, so " + p.label + " is sent" +

    }
    return { frames: frames, N: frames.length, rows: rows, head: ["Step", "Point", "Time", "Value", "Last sent", "Difference", "Decision"] };
  }

  function simCompression(cfg) {
    var P = cfg.points, dev = cfg.dev, arch = [0], frames = [], rows = [];
    var up = Infinity, lo = -Infinity, upBy = -1, loBy = -1, lastK = P.length - 1;
    for (var k = 1; k <= lastK; k++) {
      var A = P[arch[arch.length - 1]], N = P[k], slope = (N.v - A.v) / (N.t - A.t);

      var warn = -1, closing = false, caption, decision, legend, below = slope < lo;

        closing = true; warn = below ? loBy : upBy;

      }

      if (l > lo) { lo = l; loBy = k; }
      var head = N.t + " s (" + fv(N.v) + ")";

        caption = head + " arrives and becomes the snapshot. The doors open from the archived point at " + A.t + " s.";
        decision = "Snapshot"; legend = ["Doors open: upper " + fmt(up) + ", lower " + fmt(lo), "Test slope " + fmt(slope)];
      } else if (inside) {
        caption = head + ": the test slope " + fmt(slope) + " is inside the doors, so the " + P[k - 1].t + " s value is dropped.";

        legend = ["Test slope " + fmt(slope) + " is inside [" + fmt(oldLo) + ", " + fmt(oldUp) + "]", "Doors narrow to upper " + fmt(up) + ", lower " + fmt(lo)];
      } else {
        caption = head + ": the test slope " + fmt(slope) + " falls " + (below ? "below the lower" : "above the upper") + " door, so the doors close and the " + P[k - 1].t + " s value is archived.";
        decision = "Doors close: " + P[k - 1].t + " s archived";
        legend = ["Test slope " + fmt(slope) + " is " + (below ? "below the lower door " + fmt(oldLo) : "above the upper door " + fmt(oldUp)) + ": doors close",
                  "New doors from " + A.t + " s: upper " + fmt(up) + ", lower " + fmt(lo)];
      }
      if (k === lastK && cfg.final) caption += " " + cfg.final;
      var snap = arch.slice(), doors = { x0: A.t, y0: A.v, up: up, lo: lo, xe: N.t };
      frames.push({
        n: {
          doors: doors,
          ghost: closing ? { x0: testFrom.t, y0: testFrom.v, up: oldUp, lo: oldLo, xe: N.t, a: 1 }
                         : { x0: doors.x0, y0: doors.y0, up: doors.up, lo: doors.lo, xe: doors.xe, a: 0 },
          test: { x0: testFrom.t, y0: testFrom.v, t: N.t, v: N.v },
          hist: { a: k === lastK ? 1 : 0 },
          pts: pstate(P, k, function (i) { return snap.indexOf(i) >= 0; }, { warn: warn })
        },
        info: { caption: caption, legend: legend, k: k }
      });
      rows.push([k, N.t + " s", fv(N.v), fmt(slope), fmt(up), fmt(lo), decision]);
    }
    return { frames: frames, rows: rows, arch: arch, head: ["Step", "Time", "Value", "Test slope", "Upper door", "Lower door", "Decision"] };
  }

  function simZones(cfg) {
    var N = 5;
    return {
      N: N, rows: null,
      frame: function (i, mode) {
        var diode = mode === "diode", cap;

        if (seen[key]) return;
        seen[key] = true;
        out.push({ scene: s.title, item: x });
      });
    });
    return out;
  }

  function renderPanel() {
    var p = $("panel");
    p.textContent = "";
    var s = idx === 0 ? null : scenes[idx - 1];
    var src = s || data.intro;
    p.appendChild(el("h2", null, s ? idx + ". " + s.title : src.title));
    if (s) {
      var ls = {}, scan = function (v) {
        if (Array.isArray(v)) v.forEach(scan);
        else if (v && typeof v === "object") { if (typeof v.origin === "string" && v.origin.indexOf("lesson:") === 0) ls[v.origin.slice(7)] = 1; Object.keys(v).forEach(function (k) { if (k !== "origin") scan(v[k]); }); }
      };
      if (!s.kind) { scan(s.key); scan(s.facts); scan(s.limits); scan(s.governance); if (!s.misconceptionsHidden) scan(s.misconceptions); scan(s.decisions); scan(s.parking); scan(s.names); scan(s.terms); scan(s.chart); }
      var lk = Object.keys(ls);
      if (lk.length) p.appendChild(el("div", "preview", "Lessons in this stage: " + lk.join(", ")));
    }
    if (s && s.preview) p.appendChild(el("div", "preview", s.preview));
    if (s && s.remember) p.appendChild(el("div", "remember", s.remember));
    activeChart = null;
    setRings([], []);
    var walk = s && s.chart ? chartBlock(s.chart) : null;
    var story = !!(s && s.key);
    if (src.what) {
      var wp = el("p", "what");
      var mm = (walk || story) ? src.what.match(/^(.+?[.!?])\s+(.+)$/) : null;
      if (mm) {
        wp.appendChild(document.createTextNode(mm[1] + " "));
        var rest = el("span", "more", mm[2]); rest.hidden = true;
        var tgl = el("button", "linkbtn", "more"); tgl.type = "button"; tgl.setAttribute("aria-expanded", "false");
        tgl.addEventListener("click", function () { rest.hidden = !rest.hidden; tgl.textContent = rest.hidden ? "more" : "less"; tgl.setAttribute("aria-expanded", String(!rest.hidden)); });
        wp.appendChild(rest); wp.appendChild(tgl);
      } else wp.textContent = src.what;
      p.appendChild(wp);
    }
    if (walk) p.appendChild(walk);

    if (s && s.kind === "collect") {
      var items = collect(s.collect), last = null, box = null;
      items.forEach(function (o) {
        if (o.scene !== last) { last = o.scene; box = el("div", "sec " + (s.collect === "names" ? "names" : s.collect)); box.appendChild(el("h3", null, o.scene)); p.appendChild(box); }
        if (s.collect === "names") { var ul = names([o.item]); box.appendChild(ul); }
        else if (s.collect === "terms") { var dl = el("dl"), dt = el("dt", null, o.item.t), tg2 = oTag(o.item.origin); if (tg2) dt.appendChild(tg2); dl.appendChild(dt); dl.appendChild(el("dd", null, o.item.m)); box.appendChild(dl); }
        else box.appendChild(list([o.item]));
      });
      if (!items.length) p.appendChild(el("p", "tbc", TODO));
      return;
    }

    var host = p;
    if (story) {
      var kf = section("facts key", "Key facts"); kf.appendChild(list(s.key)); p.appendChild(kf);
      var nItems = ["facts", "names", "limits", "misconceptions", "governance", "terms"].reduce(function (a, k) { return a + (s[k] || []).length; }, 0) + (s.sample ? 1 : 0) + (s.tbc ? 1 : 0);
      if (nItems) {
        var det = el("details", "moredetail");
        det.appendChild(el("summary", null, "More detail (" + nItems + ")"));
        det.setAttribute("data-count", String(nItems));
        p.appendChild(det); host = det;
      }
      if (s.facts) { var ff = section("facts", "More facts"); ff.appendChild(list(s.facts)); host.appendChild(ff); }
    } else if (src.facts) { var f = section("facts", s ? "Key facts" : "Controls"); f.appendChild(list(src.facts)); p.appendChild(f); }

    if (s && s.kind === "recap") {
      var j = section("sample", "One value, stage by stage");
      var ul = el("ul");
      scenes.forEach(function (x) { if (x.sample) ul.appendChild(el("li", null, x.title + ": " + x.sample)); });
      j.appendChild(ul);
      p.appendChild(j);
    }

    if (s && s.sample) {
      var sm = section("sample", "Sample data");
      sm.appendChild(el("p", null, s.sample));
      host.appendChild(sm);
    }
    if (s && s.names) { var n = section("names", "Names"); n.appendChild(names(s.names)); host.appendChild(n); }
    if (s && s.limits) { var l = section("limits", "Limitations"); l.appendChild(list(s.limits)); host.appendChild(l); }
    if (s && s.misconceptions && !s.misconceptionsHidden) {
      var star = s.misconceptions.filter(function (x) { return (typeof x === "string" ? x : x.text).indexOf("★") === 0; }).slice(0, 1);
      if (star.length) { var mc = section("limits misc", "Misconception to expect"); mc.appendChild(list(star)); host.appendChild(mc); }
    }
    if (s && s.governance) { var g = section("governance", "Governance"); g.appendChild(list(s.governance)); host.appendChild(g); }
    if (s && s.terms) {
      var t = section("terms", "Terms");
      var dl2 = el("dl");
      s.terms.forEach(function (x) { var dt2 = el("dt", null, x.t), tg3 = oTag(x.origin); if (tg3) dt2.appendChild(tg3); dl2.appendChild(dt2); dl2.appendChild(el("dd", null, x.m)); });
      t.appendChild(dl2); host.appendChild(t);
    }
    if (s && s.tbc) host.appendChild(el("p", "tbc", s.tbc));
    if (!s) p.appendChild(el("p", "tbc", data.contentNote));
    if (walk) p.appendChild(walk.ctl);
    p.scrollTop = 0;
  }

  function render() {
    paintMap();
    renderPanel();
    $("progress").textContent = "Stage " + idx + " of " + N;
    $("prev").disabled = idx === 0;
    $("next").disabled = idx >= N;
    $("jump").value = String(idx);
    var nar = $("narration");
    nar.textContent = "";
    if (idx === 0) nar.appendChild(el("span", null, data.intro.narration));
    else {
      nar.appendChild(el("span", "stage-name", idx + ". " + scenes[idx - 1].title));
      nar.appendChild(document.createTextNode(scenes[idx - 1].narration || TODO));
    }
    var ft = $("footer");
    ft.textContent = "Learning diagram · edition " + (data.edition || "");
    if (data.trademarkNote) { ft.appendChild(document.createElement("br")); ft.appendChild(document.createTextNode(data.trademarkNote)); }
  }

  function go(n) { idx = Math.max(0, Math.min(N, n)); render(); }

  function init() {
    buildMap();
    var jump = $("jump");
    var o0 = el("option", null, "0 · Start"); o0.value = "0"; jump.appendChild(o0);
    scenes.forEach(function (s, i) { var o = el("option", null, (i + 1) + " · " + s.title); o.value = String(i + 1); jump.appendChild(o); });
    jump.addEventListener("change", function () { go(+jump.value); jump.blur(); });
    var show = $("show");
    show.appendChild(el("span", null, "Show:"));
    [["names", "Names"], ["limits", "Limits"], ["governance", "Governance"], ["sample", "Sample"], ["terms", "Terms"]].forEach(function (k) {
      var lab = el("label"), cb = el("input");
      cb.type = "checkbox"; cb.checked = true;
      cb.addEventListener("change", function () { document.body.classList.toggle("hide-" + k[0], !cb.checked); });
      lab.appendChild(cb); lab.appendChild(document.createTextNode(k[1])); show.appendChild(lab);
    });
    var sl = $("storelegend");
    [["record", "record (authoritative)"], ["cache", "cache (temporary)"], ["copy", "copy (rebuildable)"]].forEach(function (k, i) {
      var sp = el("span", "lgi");
      var sg = sv("svg", { width: 12, height: 12, viewBox: "0 0 12 12" }, sp);
      sv("circle", { "class": "badge " + k[0], cx: 6, cy: 6, r: 4.5 }, sg);
      sp.appendChild(document.createTextNode(" " + k[1]));
      if (i === 0) sl.appendChild(document.createTextNode("Data stores: "));
      sl.appendChild(sp); if (i < 2) sl.appendChild(document.createTextNode(" · "));
    });
    $("next").addEventListener("click", function () { go(idx + 1); });
    $("prev").addEventListener("click", function () { go(idx - 1); });
    $("reset").addEventListener("click", function () { go(0); });
    $("all").addEventListener("click", function () { go(N); });
    $("full").addEventListener("click", toggleFullscreen);
    render();
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  }
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.shiftKey && (e.key === "ArrowRight" || e.key === "ArrowLeft") && activeChart) { e.preventDefault(); activeChart(e.key === "ArrowRight" ? 1 : -1); return; }
    var t = e.target, tag = t.tagName, field = tag === "INPUT" || tag === "SELECT";
    if (field && e.key !== "f" && e.key !== "F" && !(tag === "INPUT" && t.type === "checkbox" && (e.key === "ArrowRight" || e.key === "ArrowLeft"))) {
      if (tag === "SELECT" || t.type === "range") return;
    }
    switch (e.key) {
      case "ArrowRight": e.preventDefault(); go(idx + 1); break;
      case "ArrowLeft": e.preventDefault(); go(idx - 1); break;
      case " ": if (tag !== "BUTTON" && !field) { e.preventDefault(); go(idx + 1); } break;
      case "[": if (activeChart) activeChart(-1); break;
      case "]": if (activeChart) activeChart(1); break;
      case "Home": e.preventDefault(); go(0); break;
      case "End": e.preventDefault(); go(N); break;
      case "f": case "F": if (!field || t.type === "checkbox") toggleFullscreen(); break;
    }
  });
  init();
})();
</script>
</body>
</html>
