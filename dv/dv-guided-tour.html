<title>Data virtualisation guided tour</title>
<style>
:root {
  --bg: #f3f6f7; --panel: #ffffff; --soft: #e9eff1; --text: #1c2a33; --muted: #566771;
  --border: #c5d1d7; --accent: #0a6f7e; --accent-text: #ffffff; --accent-tint: #dcf0f3;
  --warn: #8a5200; --warn-tint: #fbefd9;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f171c; --panel: #172229; --soft: #1e2c34; --text: #e3ebef; --muted: #9bacb5;
    --border: #2d3d46; --accent: #4cc3d4; --accent-text: #0b1a1f; --accent-tint: #173540;
    --warn: #f0b45a; --warn-tint: #2e2616;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); overflow-x: hidden;
  display: flex; flex-direction: column; padding: 0 16px; gap: 8px; }
header { padding-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 11px; cursor: pointer; }
select { max-width: 240px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#progress { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 7em; text-align: center; }
.show { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 0.8rem; color: var(--muted); align-items: center; }
.show label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }

main { flex: 1 1 auto; min-height: 0; display: grid; gap: 10px; grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr); }
#left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
#map-wrap { flex: 1 1 auto; min-height: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  display: flex; align-items: center; overflow: auto; }
#map { width: 100%; height: auto; max-height: 100%; display: block; min-width: 560px; }
#flows { min-height: 2.6em; font-size: 0.8rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
#flows b { color: var(--accent); font-weight: 600; }
.legend { font-size: 0.72rem; color: var(--muted); }

#panel { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
#panel h2 { margin: 0 0 6px; font-size: 1.05rem; }
.preview { font-size: 0.72rem; color: var(--muted); margin: -2px 0 4px; }
.remember { background: var(--accent-tint); border-left: 4px solid var(--accent); border-radius: 4px; padding: 6px 10px; font-size: 0.88rem; font-weight: 600; margin: 6px 0 8px; }
.sec { margin: 8px 0; }
.sec h3 { margin: 0 0 3px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
.sec p, .sec li { font-size: 0.84rem; line-height: 1.4; margin: 0; }
.sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
.sec .muted { color: var(--muted); }
.sec.limits h3 { color: var(--warn); }
.sec.limits { background: var(--warn-tint); border-radius: 5px; padding: 6px 10px; }
.sec.sample { border: 1px dashed var(--border); border-radius: 5px; padding: 6px 10px; }
.tbc { font-style: italic; color: var(--muted); font-size: 0.82rem; }
dl { margin: 0; font-size: 0.82rem; line-height: 1.35; }
dt { font-weight: 600; margin-top: 3px; }
dd { margin: 0; color: var(--muted); }
.nm { font-weight: 600; }
.lg { color: var(--muted); font-size: 0.78rem; }

#panel > * { flex: 0 0 auto; }
.walkctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; position: sticky; bottom: -12px; margin: auto -14px -12px; padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--border); z-index: 5; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0 2px; font-size: 0.84rem; text-decoration: underline; cursor: pointer; }
.walk .toggle { display: none; gap: 0; margin: 6px 0 0; }
.walk .toggle button { border-radius: 0; padding: 4px 12px; }
.walk .toggle button:first-child { border-radius: 6px 0 0 6px; }
.walk .toggle button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.walk .toggle button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
#flows .hop { color: var(--muted); }
.sec.walk { margin: 8px 0; }
.chart { margin-top: 4px; }
.chart svg { width: 100%; height: auto; display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 5px; }
.chart .ax { font-size: 10px; fill: var(--muted); }
.chart .ax.t { font-size: 10.5px; font-weight: 600; }
.chart .pl { font-size: 11px; font-weight: 600; fill: var(--text); text-anchor: middle; }
.chart .dl, .chart .ed { fill: var(--accent); font-weight: 600; }
.chart .hlt { fill: var(--accent); font-weight: 600; }
.chart .lg2 { fill: var(--text); font-size: 10.5px; }
.walk .caption { font-size: 0.86rem; line-height: 1.35; margin: 6px 0; }
.walkctl .stepno { font-size: 0.8rem; color: var(--muted); min-width: 6em; text-align: center; }
.walk .key { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
.walk details { margin-top: 6px; font-size: 0.8rem; }
.walk summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.walk table { border-collapse: collapse; width: 100%; margin-top: 4px; }
.walk th, .walk td { border: 1px solid var(--border); padding: 2px 5px; text-align: left; font-size: 0.74rem; }
.walk tr.cur td { background: var(--accent-tint); font-weight: 600; }

#narration { background: var(--panel); border: 1px solid var(--border); border-left: 5px solid var(--accent);
  border-radius: 6px; padding: 8px 14px; font-size: 1rem; min-height: 2.9em; }
#narration .stage-name { color: var(--accent); font-weight: 600; margin-right: 8px; }
footer { padding-bottom: 8px; font-size: 0.72rem; color: var(--muted); }

/* map */
.zone { fill: var(--soft); opacity: 0.55; }
.zone-label { font-size: 10px; fill: var(--muted); font-weight: 600; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.06em; }
.edge { fill: none; stroke: var(--accent); stroke-width: 1.8; opacity: 0.12; transition: opacity 0.3s; }
.edge.seen { opacity: 0.45; }
.edge.focus { opacity: 1; stroke-width: 2.4; stroke-dasharray: 7 5; animation: march 0.8s linear infinite; }
.edge.ref { stroke-dasharray: 3 4; }
.edge.focus.ref { stroke-dasharray: 7 5; }
@keyframes march { to { stroke-dashoffset: -12; } }
.mk { fill: var(--accent); }
.pulse { fill: var(--accent); }
.node rect { fill: var(--bg); stroke: var(--border); stroke-width: 1.2; transition: all 0.3s; }
.node { opacity: 0.22; transition: opacity 0.3s; color: var(--muted); }
.node.seen { opacity: 1; color: var(--accent); }
.node.focus { opacity: 1; color: var(--accent); }
.node.focus rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2.4; }
.node .l1 { font-size: 10.5px; font-weight: 600; fill: var(--text); text-anchor: middle; }
.node .l2 { font-size: 8.5px; fill: var(--muted); text-anchor: middle; }
.node .ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hub circle { fill: var(--accent); }
.node rect.ring, .node.focus rect.ring, .node.seen rect.ring { fill: none; stroke: var(--warn); stroke-width: 3.5; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.node[data-ring="1"] rect.ring { opacity: 1; }
.node[data-ring="1"] { opacity: 1; }
.badge { display: none; stroke: var(--accent); stroke-width: 1.6; }
svg.badges .badge, #storelegend .badge { display: block; }
.badge.record { fill: var(--accent); }
.badge.cache { fill: var(--bg); }
.badge.copy { fill: var(--bg); stroke-dasharray: 2 1.6; }
#storelegend .lgi svg { vertical-align: -2px; }
.chead { color: var(--accent); }
details.moredetail { margin: 10px 0 4px; border-top: 1px solid var(--border); padding-top: 6px; }
details.moredetail > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.86rem; }
.sec.key ul { gap: 4px; }
.edge[data-ring="1"] { stroke: var(--warn); stroke-width: 5; opacity: 1; stroke-dasharray: none; animation: none; }
.org { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
.kind { font-size: 0.72rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.03em; }
.unmapped { font-size: 0.76rem; color: var(--muted); font-style: italic; margin-top: 4px; }

/* DV additions */
.tourlink { font-size: 0.78rem; font-weight: 400; color: var(--accent); margin-left: 10px; }
.node.gone, .edge.gone, .pulse.gone, .zone.gone, .zone-label.gone { display: none; }
.edge.adv { stroke-dasharray: 6 4; }
.edge.xonly, .edge.xonly.seen, .edge.xonly.focus { opacity: 0; animation: none; }
.edge.xonly[data-blocked="1"] { opacity: 1; stroke: var(--warn); stroke-width: 3; stroke-dasharray: 6 4; }
.xmark { display: none; stroke: var(--warn); stroke-width: 4; stroke-linecap: round; }
.xmark[data-on="1"] { display: inline; }
.node.band rect { fill: var(--soft); }
.node.band .l1 { font-size: 11px; }
.chip { display: none; }
svg.zones .chip { display: inline; }
.chip text { font-size: 7.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
.chip.plant rect, .zl.plant { fill: #b3402a; background: #b3402a; }
.chip.dmz rect, .zl.dmz { fill: #9a6200; background: #9a6200; }
.chip.corp rect, .zl.corp { fill: #0a6f7e; background: #0a6f7e; }
.chip.cloud rect, .zl.cloud { fill: #6a4fb3; background: #6a4fb3; }
.chip.corpcloud rect, .zl.corpcloud { fill: #4d6b8a; background: #4d6b8a; }
.zl { display: inline-block; color: #ffffff; font-weight: 700; border-radius: 3px; padding: 0 5px; margin: 0 2px; }

.sec.plain p, .sec.example p { font-size: 0.86rem; line-height: 1.45; }
.sec.example { border-left: 3px solid var(--border); padding-left: 8px; }
.calc { border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; margin: 6px 0; font-size: 0.8rem; line-height: 1.4; opacity: 0.65; }
.calc.on { opacity: 1; border-color: var(--accent); background: var(--accent-tint); }
.calc .ctitle { font-weight: 700; color: var(--accent); }
.calc .cres { font-weight: 700; margin-top: 3px; }
.calc table { border-collapse: collapse; width: 100%; margin-top: 3px; }
.calc th, .calc td { border: 1px solid var(--border); padding: 1px 5px; text-align: left; font-size: 0.74rem; }
.calc tr.total td { font-weight: 700; }
.calc.closing { opacity: 1; font-weight: 600; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  #panel { max-height: none; }
  body { overflow-y: auto; height: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .node .ring { transition: none; }
  .edge.focus { animation: none; }
  .pulse { display: none; }
  .node, .edge, .node rect { transition: none; }
}
body.hide-names .sec.names, body.hide-limits .sec.limits, body.hide-governance .sec.governance,
body.hide-sample .sec.sample, body.hide-terms .sec.terms { display: none; }
</style>

      "plain": "Our data lives in many systems: PI, the lab system, production systems, finance. Data virtualisation is a layer that lets people ask one question and get one answer, while the data stays where it is. The layer asks each system for its part and combines the answers.",

    var show = $("show");
    show.appendChild(el("span", null, "Show:"));
    [["names", "Names"], ["limits", "Limits"], ["governance", "Governance"], ["sample", "Sample"], ["terms", "Terms"]].forEach(function (k) {
      var lab = el("label"), cb = el("input");
      cb.type = "checkbox"; cb.checked = true;
      cb.addEventListener("change", function () { document.body.classList.toggle("hide-" + k[0], !cb.checked); });
      lab.appendChild(cb); lab.appendChild(document.createTextNode(k[1])); show.appendChild(lab);
    });
    var sl = $("storelegend");
    [["record", "record (authoritative)"], ["cache", "cache (temporary)"], ["copy", "copy (rebuildable)"]].forEach(function (k, i) {
      var sp = el("span", "lgi");
      var sg = sv("svg", { width: 12, height: 12, viewBox: "0 0 12 12" }, sp);
      sv("circle", { "class": "badge " + k[0], cx: 6, cy: 6, r: 4.5 }, sg);
      sp.appendChild(document.createTextNode(" " + k[1]));
      if (i === 0) sl.appendChild(document.createTextNode("Data stores: "));
      sl.appendChild(sp); if (i < 2) sl.appendChild(document.createTextNode(" · "));
    });
    var zl = $("zonelegend");
    zl.appendChild(document.createTextNode("Zones: "));
    Object.keys(ZONES).forEach(function (k) { zl.appendChild(el("span", "zl " + k, ZONES[k])); });
    $("next").addEventListener("click", function () { go(idx + 1); });
    $("prev").addEventListener("click", function () { go(idx - 1); });
    $("reset").addEventListener("click", function () { go(0); });
    $("all").addEventListener("click", function () { go(N); });
    $("full").addEventListener("click", toggleFullscreen);
    render();
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  }
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.shiftKey && (e.key === "ArrowRight" || e.key === "ArrowLeft") && activeChart) { e.preventDefault(); activeChart(e.key === "ArrowRight" ? 1 : -1); return; }
    var t = e.target, tag = t.tagName, field = tag === "INPUT" || tag === "SELECT";
    if (field && e.key !== "f" && e.key !== "F" && !(tag === "INPUT" && t.type === "checkbox" && (e.key === "ArrowRight" || e.key === "ArrowLeft"))) {
      if (tag === "SELECT" || t.type === "range") return;
    }
    switch (e.key) {
      case "ArrowRight": e.preventDefault(); go(idx + 1); break;
      case "ArrowLeft": e.preventDefault(); go(idx - 1); break;
      case " ": if (tag !== "BUTTON" && !field) { e.preventDefault(); go(idx + 1); } break;
      case "[": if (activeChart) activeChart(-1); break;
      case "]": if (activeChart) activeChart(1); break;
      case "Home": e.preventDefault(); go(0); break;
      case "End": e.preventDefault(); go(N); break;
      case "f": case "F": if (!field || t.type === "checkbox") toggleFullscreen(); break;
    }
  });
  init();
})();
</script>
</body>
</html>
